<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Floréa Haven — flowers, seeds, and botanical fragrances for slower, more beautiful days."
    />
    <meta name="theme-color" content="#fffaf8" />
    <script>
      (() => {
        const storageKey = 'florea-theme-preference';
        const allowedPreferences = ['system', 'light', 'dark'];
        let preference = 'system';

        try {
          const savedPreference = localStorage.getItem(storageKey);
          if (allowedPreferences.includes(savedPreference)) {
            preference = savedPreference;
          }
        } catch {
          // Storage can be unavailable in strict privacy contexts.
        }

        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        const resolvedTheme = preference === 'system' ? systemTheme : preference;
        const root = document.documentElement;

        root.dataset.theme = resolvedTheme;
        root.dataset.themePreference = preference;
        root.style.colorScheme = resolvedTheme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', resolvedTheme === 'dark' ? '#211820' : '#fffaf8');
      })();
    </script>
    <title>Floréa Haven — Let beauty take root</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
