services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: florea_haven
      POSTGRES_USER: florea
      POSTGRES_PASSWORD: florea
    ports:
      - '5432:5432'
    volumes:
      - florea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U florea -d florea_haven']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  florea_postgres_data:
